<style>
*{box-sizing:border-box}
html,body,#app{margin:0;min-height:100%;background:#090e18;color:#e8edf5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.top{padding:10px 14px;background:#0d1522;border-bottom:1px solid #263247;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1000;box-shadow:0 8px 24px #0003}
.logo{font-size:26px;line-height:1}.brand{font-weight:950;letter-spacing:.055em;white-space:nowrap}.sub{display:block;color:#8190a8;font-size:10px;font-weight:600;letter-spacing:.02em}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.pill{background:#151f2f;border:1px solid #2b3a50;padding:6px 8px;border-radius:999px;font-size:11px;white-space:nowrap}
.controls{display:flex;gap:5px}.controls button,.btn{border:1px solid #345071;background:#17253a;color:#dce9f7;border-radius:7px;padding:7px 10px;font-weight:800;cursor:pointer}.controls .on{background:#2869c7;border-color:#5d9bea}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:minmax(380px,1fr) 220px;grid-template-areas:"map detail" "queue detail";min-height:0;overflow:hidden}
.panel{background:#0f1623;padding:13px;overflow:auto}

.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h2{font-size:15px;margin:0 0 10px;letter-spacing:.02em}.small{font-size:11px;padding:6px 8px}
.incidents{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:0 1px 5px;scrollbar-width:thin}
.incident{display:block;flex:0 0 250px;text-align:left;background:#151e2d;border:1px solid #29364a;color:#e8edf5;border-radius:11px;padding:10px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.incident:hover{transform:translateY(-1px);background:#192334}.incident.sel{border-color:#66a5ff;box-shadow:inset 0 -3px #5693ef,0 0 0 1px #5693ef22}.incident.done{opacity:.45}.row{display:flex;justify-content:space-between;gap:8px}
.code{background:#755623;color:#ffe0a8;border-radius:5px;padding:3px 6px;font-size:10px;font-weight:900}.addr{color:#8392a8;font-size:10px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapwrap{grid-area:map;position:relative;min-height:0;background:#24313d}.map{position:absolute;inset:0;z-index:1}
.detail h2{font-size:20px;margin:4px 0}.muted{color:#8290a4;font-size:11px}.section{border-top:1px solid #273246;padding-top:11px;margin-top:11px}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.req{background:#151e2b;border:1px solid #303d51;padding:8px;border-radius:7px;font-size:11px;display:flex;justify-content:space-between}.req.ok{border-color:#34704b;background:#13271b}
.vehicles{display:flex;flex-direction:column;gap:6px}.veh{width:100%;display:flex;align-items:center;gap:8px;background:#151e2b;color:#e8edf5;border:1px solid #303d51;border-radius:8px;padding:9px;text-align:left;cursor:pointer}
.veh.sel{border-color:#5b91df;background:#172941}.veh.busy{opacity:.45;cursor:default}.check{width:20px;height:20px;border:1px solid #53637a;border-radius:4px;display:grid;place-items:center}.vmain{flex:1}.vmain strong,.vmain small{display:block}.vmain small{font-size:9px;color:#8392a8}
.dispatch{width:100%;margin-top:9px;padding:12px;border-radius:8px;border:1px solid #6ca1ef;background:#2e6dbc;color:white;font-weight:900;cursor:pointer}.dispatch:disabled{opacity:.35;cursor:default}
.log{max-height:180px;overflow:auto;font-size:11px}.msg{padding:7px 0;border-bottom:1px solid #202a39}.warn{color:#f5bd62}.danger{color:#ff8787}.good{color:#77d79a}
.tabs{display:flex;gap:6px;margin:-2px -2px 12px;position:sticky;top:0;z-index:5;background:#0f1623;padding:2px 2px 8px}.tabs button{flex:1;border:1px solid #344258;background:#141d2c;color:#aab8cb;padding:9px;border-radius:8px;font-weight:850}.tabs button.on{background:#244b7c;color:#fff;border-color:#5388c9;box-shadow:inset 0 -2px #7db5ff}
.riskbar,.progressbar{height:9px;background:#202b3a;border-radius:99px;overflow:hidden;margin-top:6px}.riskfill,.progressfill{height:100%;background:#d66b49}.progressfill{background:#4c91e6}.riskrow{display:flex;justify-content:space-between;font-size:11px;margin-top:10px}.risklow{color:#78d79b}.riskmid{color:#f2bd65}.riskhigh{color:#ff7c7c}
.decision{background:#171f2d;border:1px solid #46536a;border-radius:10px;padding:10px;margin-top:10px}.decision strong{display:block;margin-bottom:5px}.choice{display:block;width:100%;text-align:left;margin-top:7px;padding:9px;border-radius:8px;border:1px solid #3a4e69;background:#16243a;color:#eaf2ff}.choice:hover{background:#1c3150}.choice small{display:block;color:#98a8bd;margin-top:3px}
.stationcard,.upgrade{background:#151e2b;border:1px solid #303d51;border-radius:9px;padding:10px;margin-bottom:8px}.stationcard h3,.upgrade h3{font-size:13px;margin:0 0 5px}.metric{display:flex;justify-content:space-between;font-size:11px;color:#aab7c7;margin-top:4px}.upgrade button{width:100%;margin-top:8px;padding:8px;border:1px solid #4c6d96;border-radius:7px;background:#213c60;color:#fff;font-weight:800}.upgrade button:disabled{opacity:.35}.goal{background:#132338;border:1px solid #35557d;border-radius:9px;padding:9px;margin-bottom:10px}.goal strong{font-size:12px}.goal small{display:block;color:#93a5bb;margin-top:4px}.badge{display:inline-block;padding:2px 5px;border-radius:4px;background:#26354a;color:#b9c9dc;font-size:9px;margin-right:4px}
.aao{background:#101c2d;border:1px solid #31547d;border-radius:10px;padding:10px;margin-top:12px}
.aaohead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.aaohead strong{font-size:12px}.aaostatus{font-size:10px;color:#9fb0c7}
.aaolist{display:flex;flex-wrap:wrap;gap:5px}.aaoslot{font-size:10px;padding:5px 7px;border-radius:999px;background:#17263a;border:1px solid #314861;color:#cbd9e9}
.aaoslot.ok{border-color:#3f7a57;background:#14291d;color:#9de0b6}.aaoslot.missing{border-color:#774747;background:#2b1818;color:#ffadad}
.aaobutton{width:100%;margin-top:8px;padding:10px;border:1px solid #5b95dc;border-radius:8px;background:#235991;color:#fff;font-weight:900;cursor:pointer}.aaobutton:disabled{opacity:.35;cursor:default}
.map-badge{position:absolute;z-index:500;top:10px;left:50%;transform:translateX(-50%);background:#0d1522e8;border:1px solid #3c4b62;border-radius:999px;padding:6px 10px;font-size:10px;pointer-events:none;box-shadow:0 4px 12px #0004;backdrop-filter:blur(5px)}
.leaflet-control-attribution{font-size:9px!important}
.game-icon{background:transparent!important;border:0!important}
.pin{display:grid;place-items:center;position:relative;filter:drop-shadow(0 2px 4px #0008)}
.pin.station{width:38px;height:38px;border-radius:9px;background:#1b4e91;border:2px solid #a7ceff;font-size:20px}
.pin.incident{width:42px;height:42px;border-radius:50%;background:#8f3b2d;border:2px solid #ffd0c0;font-size:21px;animation:pulse 1.8s infinite}
.pin.incident.selected{outline:4px solid #ffffff99;outline-offset:3px}
.pin.unit{width:29px;height:29px;border-radius:7px;background:#2673c7;border:2px solid #d4e7ff;font-size:16px}
.pin.unit.go{background:#d84242}.pin.unit.scene{background:#d8962d}.pin.unit.back{background:#66788f}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff795855}50%{box-shadow:0 0 0 8px #ff795800}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111b2b;color:#edf4ff}.leaflet-popup-content{margin:10px 12px;font-size:12px}
@media(max-width:800px){
 html,body,#app{min-height:100%;height:auto}.app{height:auto;min-height:100vh;overflow:visible;display:block}
 .top{padding:8px 9px;position:sticky;top:0;gap:7px}.logo{font-size:22px}.brand{font-size:13px}.sub{font-size:8px}
 .stats{order:3;width:100%;margin:0;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;padding-bottom:1px}.pill{flex:0 0 auto;padding:5px 7px;font-size:10px}

 .incidents{gap:8px}.incident{flex:0 0 min(78vw,260px);padding:9px}

 .veh{padding:10px}.dispatch{position:sticky;bottom:8px;z-index:30;box-shadow:0 7px 20px #0009}

}
@media(max-width:430px){
 .reqs{grid-template-columns:1fr}.tabs{top:74px}.brand{max-width:180px;overflow:hidden;text-overflow:ellipsis}.mapwrap{height:40vh}
}
</style>

<body>

<script>
const stations=[
 {id:'a',name:'FF Sonnenfels',lat:52.3786,lng:9.7195},
 {id:'b',name:'FF Eichenrode',lat:52.3905,lng:9.7640},
 {id:'c',name:'Rettungswache Süd',lat:52.3478,lng:9.7430}
];

const base=[
 ['h','HLF 20','Florian SF 46-1','a',{fire:3,rescue:2}],
 ['d','DLK 23/12','Florian SF 30-1','a',{fire:1,ladder:3}],
 ['l','LF 10','Florian ER 42-1','b',{fire:2,rescue:1}],
 ['e','ELW 1','Florian ER 11-1','b',{command:3}],
 ['r1','RTW','Rettung 1-83-1','c',{medical:3}],
 ['r2','RTW','Rettung 1-83-2','c',{medical:3}]
];

const templates=[
 {code:'B2',title:'Rauchentwicklung aus Gebäude',lat:52.3728,lng:9.7425,req:{fire:3,rescue:1,medical:1},need:120,risk:34,reward:900,xp:150,report:'Mehrere Anrufer melden Rauch aus einem Wohnhaus.',
  decision:{prompt:'Eine Person wird noch in der Wohnung vermutet. Wie soll vorgegangen werden?',choices:[
   {label:'Innenangriff sofort',hint:'Schneller Fortschritt, aber höheres Risiko.',work:34,risk:12,log:'Angriffstrupp geht sofort zur Menschenrettung vor.'},
   {label:'Nachbarwehr nachfordern',hint:'Kostet 350 €, dafür zusätzliche Löschkräfte nach kurzer Zeit.',risk:-10,cost:350,support:{eta:90,caps:{fire:2,rescue:1}},log:'Überörtliche Kräfte sind nachalarmiert.'}
  ]}},
 {code:'TH Y',title:'VU – Person eingeklemmt',lat:52.3845,lng:9.7840,req:{rescue:3,medical:2},need:115,risk:28,reward:1050,xp:170,report:'PKW gegen Baum. Eine Person ist eingeschlossen.',
  decision:{prompt:'Der Patient ist ansprechbar, klagt aber über starke Schmerzen.',choices:[
   {label:'Schnelle Rettung einleiten',hint:'Beschleunigt die Befreiung, erhöht aber das medizinische Risiko.',work:30,risk:14,log:'Schnelle technische Rettung wird eingeleitet.'},
   {label:'Notarzt nachfordern',hint:'Kostet 300 €, senkt das Risiko und bringt medizinische Unterstützung.',risk:-16,cost:300,support:{eta:60,caps:{medical:2}},log:'Notarzt ist nachgefordert.'}
  ]}},
 {code:'B1',title:'Mülleimerbrand',lat:52.3558,lng:9.7105,req:{fire:1},need:58,risk:16,reward:430,xp:75,report:'Müllcontainer brennt auf einem Parkplatz.',
  decision:{prompt:'Das Feuer steht nah an einer Fassade.',choices:[
   {label:'Direkt ablöschen',hint:'Schnell, mit leichtem Risiko einer Ausbreitung.',work:24,risk:7,log:'Trupp beginnt sofort mit der Brandbekämpfung.'},
   {label:'Fassade zuerst kontrollieren',hint:'Etwas langsamer, senkt aber das Risiko deutlich.',need:14,risk:-13,log:'Fassade wird kontrolliert und gekühlt.'}
  ]}},
 {code:'H1',title:'Person hinter Tür',lat:52.3872,lng:9.7355,req:{rescue:1,medical:1},need:75,risk:24,reward:620,xp:100,report:'Hilferufe aus einer verschlossenen Wohnung.',
  decision:{prompt:'Die Tür ist verschlossen, die Person antwortet nur noch schwach.',choices:[
   {label:'Tür gewaltsam öffnen',hint:'Schneller Zugang, höheres Schadensrisiko.',work:28,risk:8,log:'Gewaltsame Türöffnung wird durchgeführt.'},
   {label:'Schonende Öffnung versuchen',hint:'Weniger Schaden, aber der Einsatz dauert länger.',need:18,risk:-6,log:'Schonende Türöffnung wird vorbereitet.'}
  ]}},
 {code:'B2',title:'Kellerbrand',lat:52.3615,lng:9.7710,req:{fire:4,rescue:1,medical:1},need:145,risk:40,reward:1150,xp:190,report:'Starke Rauchentwicklung aus Kellerfenstern.',
  decision:{prompt:'Der Treppenraum ist stark verraucht, die Wasserversorgung ist noch nicht gesichert.',choices:[
   {label:'Mit Tankwasser vorgehen',hint:'Schneller Angriff, aber die Reserve ist knapp.',work:38,risk:15,log:'Innenangriff startet mit dem vorhandenen Tankwasser.'},
   {label:'Wasserversorgung zuerst sichern',hint:'Langsamer, dafür deutlich sicherer.',need:20,risk:-18,log:'Wasserversorgung wird aufgebaut, Angriff verzögert sich.'}
  ]}}
];

const cap={fire:'🔥 Brand',rescue:'🛠 Rettung',medical:'❤️ Medizin',ladder:'🪜 Leiter',command:'📻 Führung'};
const SIM_TIME_SCALE=6;
const geocodeCache=new Map();
const AAO={
 'B2':[
   {label:'Löschfahrzeug',types:['HLF 20','LF 10']},
   {label:'Drehleiter',types:['DLK 23/12']},
   {label:'Rettungsdienst',types:['RTW']}
 ],
 'TH Y':[
   {label:'Technische Rettung',types:['HLF 20']},
   {label:'Rettungsdienst',types:['RTW']}
 ],
 'B1':[
   {label:'Löschfahrzeug',types:['LF 10','HLF 20']}
 ],
 'H1':[
   {label:'Türöffnung',types:['HLF 20','LF 10']},
   {label:'Rettungsdienst',types:['RTW']}
 ]
};
const INCIDENT_AREA={minLat:52.342,maxLat:52.401,minLng:9.688,maxLng:9.797};
let vehicles=[],incidents=[],selected='i1',chosen=[],speed=1,paused=false,serial=2,money=7500,rep=64,clock=8*3600+12*60;
let xp=0,completed=0,failed=0,rightMode='incident',nextIncidentAt=clock+420,upgrades={agt:false,crew:false,hlf:false,rtw:false},spawningIncident=false;
let map;
const stationMarkers=new Map(),incidentMarkers=new Map(),vehicleMarkers=new Map(),routeLines=new Map();
const app=document.querySelector('#app');
const S=id=>stations.find(x=>x.id===id);
const I=()=>incidents.find(x=>x.id===selected)||incidents[0];
const level=()=>1+Math.floor(xp/500);
const levelProgress=()=>xp%500;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const dist=(a,b)=>Math.hypot(a.lat-b.lat,(a.lng-b.lng)*0.62);

function initLayout(){
 app.innerHTML=`
 <div class="app">
  <header class="top">
   <div class="logo">🚨</div>
   <div class="brand">LANDKREIS 112<span class="sub">Leitstelle Sonnenfels · Leitstellen-Tycoon · Prototyp 0.5</span></div>
   <div class="stats" id="stats"></div>
   <div class="controls" id="controls"></div>
  </header>
  <main class="grid">
   <section class="mapwrap"><div id="map" class="map"></div><div class="map-badge">🗺️ OSM · fiktive Einsatzlagen</div></section>
   <aside class="panel queue"><div class="head"><h2>🚨 Einsatzlage</h2><button class="btn small" id="newIncident">+ Testeinsatz</button></div><div class="incidents" id="incidentList"></div></aside>
   <aside class="panel detailpanel"><div class="tabs"><button id="tabIncident" class="on">🚨 Einsatz</button><button id="tabManage">🏗️ Ausbau</button></div><div id="detail"></div></aside>
  </main>
 </div>`;

 map=L.map('map',{zoomControl:true}).setView([52.3715,9.7420],13);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
   maxZoom:19,
   attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
 }).addTo(map);

 stations.forEach(s=>{
   const marker=L.marker([s.lat,s.lng],{icon:icon('station','🏢')}).addTo(map);
   marker.bindPopup('<strong>'+s.name+'</strong><br>Feuerwehr-/Rettungsstandort');
   stationMarkers.set(s.id,marker);
 });

 document.querySelector('#newIncident').onclick=()=>{
   createRandomIncident(true);
 };
 setTimeout(()=>map.invalidateSize(),100);
}

function icon(type,emoji,extra=''){
 return L.divIcon({className:'game-icon',html:`<div class="pin ${type} ${extra}">${emoji}</div>`,iconSize:[42,42],iconAnchor:[21,21]});
}

function reset(){
 stations.forEach(s=>{
   if(s.id==='a'){s.crew=14;s.maxCrew=14;s.agt=4;s.maxAgt=4}
   if(s.id==='b'){s.crew=10;s.maxCrew=10;s.agt=4;s.maxAgt=4}
   if(s.id==='c'){s.crew=4;s.maxCrew=4;s.agt=0;s.maxAgt=0}
 });
 vehicles=base.map(([id,type,call,station,caps])=>{
   const s=S(station);
   const personnel=type==='HLF 20'||type==='LF 10'?{crew:6,agt:4}:type==='DLK 23/12'?{crew:2,agt:0}:type==='RTW'?{crew:2,agt:0}:{crew:2,agt:0};
   return{id,type,call,station,caps:{...caps},personnel,lat:s.lat,lng:s.lng,status:'free',target:null,route:null,routeIndex:0,routeDistance:0,routeDuration:0,reserved:false};
 });
 incidents=[make(0,1)];
 selected='i1';chosen=[];speed=1;paused=false;serial=2;money=7500;rep=64;clock=8*3600+12*60;
 xp=0;completed=0;failed=0;rightMode='incident';nextIncidentAt=clock+420;upgrades={agt:false,crew:false,hlf:false,rtw:false};spawningIncident=false;
 render();
 randomizeIncidentLocation(incidents[0]);

}

function make(n,id,location=null){
 const t=templates[n%templates.length];
 return{id:'i'+id,t:t.code,title:t.title,address:'Adresse wird ermittelt…',lat:location?location.lat:t.lat,lng:location?location.lng:t.lng,req:{...t.req},need:t.need,work:0,age:0,status:'open',stage:0,
   risk:t.risk,reward:t.reward,xp:t.xp,decision:t.decision,decisionMade:false,support:null,supportArrived:false,
   log:[{text:t.report,tone:''}]};
}

function randomAreaPoint(){
 return{
   lat:INCIDENT_AREA.minLat+Math.random()*(INCIDENT_AREA.maxLat-INCIDENT_AREA.minLat),
   lng:INCIDENT_AREA.minLng+Math.random()*(INCIDENT_AREA.maxLng-INCIDENT_AREA.minLng)
 };
}

async function snapToRoad(point){
 const url='https://router.project-osrm.org/nearest/v1/driving/'+point.lng+','+point.lat+'?number=1';
 const res=await fetch(url);
 if(!res.ok)throw new Error('Nearest HTTP '+res.status);
 const data=await res.json();
 if(data.code!=='Ok'||!data.waypoints||!data.waypoints[0])throw new Error('Keine Straße gefunden');
 const [lng,lat]=data.waypoints[0].location;
 return{lat,lng};
}

async function getRandomRoutablePoint(){
 for(let attempt=0;attempt<5;attempt++){
   try{
     const p=await snapToRoad(randomAreaPoint());
     const tooClose=incidents.some(i=>i.status==='open'&&metersBetween(i,p)<700);
     if(!tooClose)return p;
   }catch(err){}
 }
 return snapToRoad(randomAreaPoint());
}

async function randomizeIncidentLocation(incident){
 try{
   const p=await getRandomRoutablePoint();
   incident.lat=p.lat;incident.lng=p.lng;incident.address='Adresse wird ermittelt…';
   if(incidentMarkers.has(incident.id)){
     incidentMarkers.get(incident.id).setLatLng([p.lat,p.lng]);
   }
   render();
   map.panTo([p.lat,p.lng]);
   await resolveIncidentAddress(incident);
 }catch(err){
   incident.log.push({text:'Zufälliger OSM-Einsatzort konnte nicht geladen werden. Fallback-Position aktiv.',tone:'warn'});
   resolveIncidentAddress(incident);
 }
}

async function createRandomIncident(selectIt=true){
 if(spawningIncident)return;
 if(incidents.filter(i=>i.status==='open').length>=4){
   if(selectIt){
     const current=I();if(current)current.log.push({text:'Maximal vier offene Einsätze gleichzeitig.',tone:'warn'});
     render();
   }
   return;
 }
 spawningIncident=true;
 try{
   const point=await getRandomRoutablePoint();
   const idx=Math.floor(Math.random()*templates.length);
   const n=make(idx,serial++,point);
   incidents.push(n);
   if(selectIt){selected=n.id;chosen=[];rightMode='incident';map.panTo([n.lat,n.lng])}
   render();
   await resolveIncidentAddress(n);
 }catch(err){
   const idx=Math.floor(Math.random()*templates.length);
   const n=make(idx,serial++);
   incidents.push(n);
   if(selectIt){selected=n.id;chosen=[];rightMode='incident'}
   n.log.push({text:'OSM-Zufallsort nicht erreichbar, Fallback-Position verwendet.',tone:'warn'});
   render();
   resolveIncidentAddress(n);
 }finally{
   spawningIncident=false;
 }
}

function formatOsmAddress(data,incident){
 const a=data&&data.address?data.address:{};
 const road=a.road||a.pedestrian||a.residential||a.footway||a.cycleway||a.path||a.neighbourhood||a.suburb;
 const house=a.house_number;
 const place=a.city||a.town||a.village||a.municipality||a.county;
 if(road&&house&&place)return road+' '+house+', '+place;
 if(road&&place)return road+', '+place;
 if(place)return place+' · '+incident.lat.toFixed(5)+', '+incident.lng.toFixed(5);
 return incident.lat.toFixed(5)+', '+incident.lng.toFixed(5);
}

async function resolveIncidentAddress(incident){
 if(!incident)return;
 const key=incident.lat.toFixed(5)+','+incident.lng.toFixed(5);
 if(geocodeCache.has(key)){
   incident.address=geocodeCache.get(key);
   render();
   return;
 }
 try{
   const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+
     encodeURIComponent(incident.lat)+'&lon='+encodeURIComponent(incident.lng);
   const res=await fetch(url,{headers:{'Accept-Language':'de'}});
   if(!res.ok)throw new Error('Geocoding HTTP '+res.status);
   const data=await res.json();
   const address=formatOsmAddress(data,incident);
   geocodeCache.set(key,address);
   incident.address=address;
 }catch(err){
   incident.address='Koordinaten '+incident.lat.toFixed(5)+', '+incident.lng.toFixed(5);
   incident.log.push({text:'Adresse konnte nicht geladen werden. Koordinaten werden angezeigt.',tone:'warn'});
 }
 render();
}

function availableCaps(i){
 const o={};
 vehicles.filter(v=>v.target===i.id&&v.status==='scene').forEach(v=>Object.entries(v.caps).forEach(([k,n])=>o[k]=(o[k]||0)+n));
 if(i.supportArrived&&i.support&&i.support.caps)Object.entries(i.support.caps).forEach(([k,n])=>o[k]=(o[k]||0)+n);
 return o;
}

function crewAvailable(v){
 const s=S(v.station);
 return s.crew>=v.personnel.crew&&s.agt>=v.personnel.agt;
}

function reserveCrew(v){
 if(v.reserved)return true;
 const s=S(v.station);
 if(!crewAvailable(v))return false;
 s.crew-=v.personnel.crew;s.agt-=v.personnel.agt;v.reserved=true;return true;
}

function releaseCrew(v){
 if(!v.reserved)return;
 const s=S(v.station);
 s.crew=Math.min(s.maxCrew,s.crew+v.personnel.crew);
 s.agt=Math.min(s.maxAgt,s.agt+v.personnel.agt);
 v.reserved=false;
}

function getAaoSlots(i){
 return AAO[i.t]||[];
}

function getAaoPlan(i){
 const used=new Set();
 const assignments=[];
 const missing=[];
 getAaoSlots(i).forEach(slot=>{
   const candidates=vehicles
     .filter(v=>!used.has(v.id)&&v.status==='free'&&crewAvailable(v)&&slot.types.includes(v.type))
     .sort((a,b)=>metersBetween(a,i)-metersBetween(b,i));
   if(candidates.length){
     const v=candidates[0];
     used.add(v.id);
     assignments.push({slot:slot.label,vehicle:v});
   }else{
     missing.push(slot.label);
   }
 });
 return{assignments,missing};
}

function alarmAao(){
 const i=I();if(!i||i.status!=='open')return;
 const plan=getAaoPlan(i);
 const ids=plan.assignments.map(x=>x.vehicle.id);
 if(!ids.length){
   i.log.push({text:'AAO: Keine passenden verfügbaren Fahrzeuge.',tone:'danger'});
   render();
   return;
 }
 if(plan.missing.length){
   i.log.push({text:'AAO unvollständig: '+plan.missing.join(', ')+' nicht verfügbar.',tone:'warn'});
 }
 dispatchIds(ids,i,'AAO');
}

function syncMap(){
 incidents.forEach(i=>{
   if(i.status==='done'){
     const m=incidentMarkers.get(i.id);if(m){m.remove();incidentMarkers.delete(i.id)}
     return;
   }
   let m=incidentMarkers.get(i.id);
   if(!m){
     m=L.marker([i.lat,i.lng],{icon:icon('incident','🔥',i.id===selected?'selected':'')}).addTo(map);
     m.on('click',()=>{selected=i.id;chosen=[];render()});
     incidentMarkers.set(i.id,m);
   }
   m.setLatLng([i.lat,i.lng]);
   m.setIcon(icon('incident','🔥',i.id===selected?'selected':''));
   m.bindPopup('<strong>'+i.t+' · '+i.title+'</strong><br>'+i.address);
 });

 [...incidentMarkers.keys()].forEach(id=>{
   if(!incidents.some(i=>i.id===id&&i.status!=='done')){
     incidentMarkers.get(id).remove();incidentMarkers.delete(id);
   }
 });

 vehicles.forEach(v=>{
   let m=vehicleMarkers.get(v.id);
   const emoji=v.type==='RTW'?'✚':'🚒';
   if(!m){
     m=L.marker([v.lat,v.lng],{icon:icon('unit',emoji,v.status)}).addTo(map);
     m.bindTooltip(v.call,{direction:'top',offset:[0,-12]});
     vehicleMarkers.set(v.id,m);
   }
   m.setLatLng([v.lat,v.lng]);
   m.setIcon(icon('unit',emoji,v.status));

   let line=routeLines.get(v.id);
   if(v.route&&v.route.length>1){
     const latlngs=v.route.map(p=>[p.lat,p.lng]);
     if(!line){
       line=L.polyline(latlngs,{weight:4,opacity:.72,dashArray:v.status==='back'?'7 7':null}).addTo(map);
       routeLines.set(v.id,line);
     }else{
       line.setLatLngs(latlngs);
       line.setStyle({dashArray:v.status==='back'?'7 7':null});
     }
   }else if(line){
     line.remove();
     routeLines.delete(v.id);
   }
 });
}

function render(){
 const i=I(),caps=i?availableCaps(i):{},open=incidents.filter(x=>x.status==='open').length;
 const time=new Date(clock*1000).toISOString().slice(11,16);
 const countdown=Math.max(0,Math.ceil((nextIncidentAt-clock)/60));

 document.querySelector('#stats').innerHTML=
   '<span class="pill">🕒 '+time+'</span>'+
   '<span class="pill">⚠️ '+open+' offen</span>'+
   '<span class="pill">⭐ Lvl '+level()+'</span>'+
   '<span class="pill">👥 '+rep+'%</span>'+
   '<span class="pill">€ '+money+'</span>'+
   '<span class="pill">📟 '+countdown+' min</span>';

 document.querySelector('#controls').innerHTML=
   '<button id="pauseBtn">'+(paused?'▶':'⏸')+'</button>'+
   [1,2,4].map(x=>'<button data-speed="'+x+'" class="'+(!paused&&speed===x?'on':'')+'">'+x+'×</button>').join('')+
   '<button id="resetBtn">↻</button>';

 document.querySelector('#incidentList').innerHTML=incidents.map(x=>
   '<button class="incident '+(x.id===selected?'sel ':'')+(x.status!=='open'?'done':'')+'" data-inc="'+x.id+'">'+
      '<div class="row"><span class="code">'+x.t+'</span><small>'+Math.floor(x.age/60)+':'+String(Math.floor(x.age%60)).padStart(2,'0')+'</small></div>'+
      '<strong>'+x.title+'</strong>'+
      '<div class="addr">📍 '+x.address+'</div>'+
      '<div class="riskrow"><span>Gefahr</span><b class="'+(x.risk<40?'risklow':x.risk<70?'riskmid':'riskhigh')+'">'+Math.round(x.risk)+'%</b></div>'+
      '<div class="riskbar"><div class="riskfill" style="width:'+clamp(x.risk,0,100)+'%"></div></div>'+
    '</button>').join('');

 document.querySelector('#tabIncident').classList.toggle('on',rightMode==='incident');
 document.querySelector('#tabManage').classList.toggle('on',rightMode==='manage');
 document.querySelector('#detail').innerHTML=rightMode==='manage'?managementView():(i?detail(i,caps):'<h2>Kein Einsatz</h2>');

 bindUi();
 syncMap();
}

function detail(i,caps){
 const riskClass=i.risk<40?'risklow':i.risk<70?'riskmid':'riskhigh';
 const decision=(i.stage>=1&&!i.decisionMade&&i.status==='open'&&i.decision)?
   '<div class="decision"><strong>⚡ Entscheidung erforderlich</strong><div class="muted">'+i.decision.prompt+'</div>'+
   i.decision.choices.map((ch,idx)=>'<button class="choice" data-choice="'+idx+'" '+(ch.cost&&ch.cost>money?'disabled':'')+'><b>'+ch.label+'</b><small>'+ch.hint+(ch.cost?' · '+ch.cost+' €':'')+'</small></button>').join('')+
   '</div>':'';
 const aao=getAaoPlan(i);
 const aaoBlock=i.status==='open'&&getAaoSlots(i).length?
 '<div class="aao"><div class="aaohead"><strong>📟 AAO '+i.t+'</strong><span class="aaostatus">'+aao.assignments.length+'/'+getAaoSlots(i).length+' verfügbar</span></div>'+
 '<div class="aaolist">'+
   aao.assignments.map(x=>'<span class="aaoslot ok">✓ '+x.slot+': '+x.vehicle.type+'</span>').join('')+
   aao.missing.map(x=>'<span class="aaoslot missing">✕ '+x+'</span>').join('')+
 '</div><button class="aaobutton" id="aaoBtn" '+(!aao.assignments.length?'disabled':'')+'>🚨 AAO alarmieren</button></div>':'';
 return '<span class="code">'+i.t+'</span><h2>'+i.title+'</h2><div class="muted">📍 '+i.address+'</div>'+
 '<div class="riskrow"><span>Gefahrenentwicklung</span><b class="'+riskClass+'">'+Math.round(i.risk)+'%</b></div><div class="riskbar"><div class="riskfill" style="width:'+clamp(i.risk,0,100)+'%"></div></div>'+
 aaoBlock+
 decision+
 '<div class="section"><strong>Anforderungen</strong><div class="reqs">'+
  Object.entries(i.req).map(([k,n])=>'<div class="req '+((caps[k]||0)>=n?'ok':'')+'"><span>'+cap[k]+'</span><b>'+(caps[k]||0)+' / '+n+'</b></div>').join('')+
 '</div></div>'+
 '<div class="section"><strong>Lagemeldungen</strong><div class="log">'+
  [...i.log].reverse().map(x=>'<div class="msg '+x.tone+'">'+x.text+'</div>').join('')+
 '</div></div>'+
 '<div class="section"><strong>Fahrzeuge alarmieren</strong><div class="vehicles">'+
  vehicles.map(v=>{
    const staffed=crewAvailable(v);
    return '<button class="veh '+(chosen.includes(v.id)?'sel ':'')+(v.status!=='free'||!staffed?'busy':'')+'" data-veh="'+v.id+'" '+(v.status!=='free'||!staffed?'disabled':'')+'>'+
    '<span class="check">'+(chosen.includes(v.id)?'✓':'')+'</span>'+
    '<span class="vmain"><strong>'+v.type+'</strong><small>'+v.call+' · '+S(v.station).name+' · 👥'+v.personnel.crew+(v.personnel.agt?' · 🫁'+v.personnel.agt:'')+'</small></span>'+
    '<small>'+(v.status==='free'?(staffed?'frei':'Personal fehlt'):v.status==='routing'?'Route…':v.status==='go'?'Anfahrt':v.status==='scene'?'vor Ort':'Rückfahrt')+'</small></button>';
  }).join('')+
 '</div><button class="dispatch" id="dispatchBtn" '+(!chosen.length?'disabled':'')+'>📻 ALARMIEREN ('+chosen.length+')</button></div>';
}

function managementView(){
 return '<div class="goal"><strong>🎯 Schichtziel: 6 Einsätze erfolgreich abschließen</strong><small>'+completed+' / 6 geschafft · '+failed+' fehlgeschlagen</small>'+
 '<div class="progressbar"><div class="progressfill" style="width:'+Math.min(100,completed/6*100)+'%"></div></div></div>'+
 '<div class="goal"><strong>⭐ Erfahrungsstufe '+level()+'</strong><small>'+levelProgress()+' / 500 XP bis zur nächsten Stufe</small>'+
 '<div class="progressbar"><div class="progressfill" style="width:'+(levelProgress()/5)+'%"></div></div></div>'+
 '<h2>Wachen & Personal</h2>'+
 stations.map(s=>'<div class="stationcard"><h3>'+s.name+'</h3><div class="metric"><span>Verfügbares Personal</span><b>'+s.crew+' / '+s.maxCrew+'</b></div>'+
 '<div class="metric"><span>Atemschutzgeräteträger</span><b>'+s.agt+' / '+s.maxAgt+'</b></div></div>').join('')+
 '<h2>Investitionen</h2>'+
 upgradeCard('agt','🫁 AGT-Ausbildung','+2 Atemschutzgeräteträger in Sonnenfels.',2500)+
 upgradeCard('crew','👨‍🚒 Mitgliederwerbung','+4 Einsatzkräfte in Eichenrode.',1800)+
 upgradeCard('hlf','🚒 HLF-Aufrüstung','HLF erhält +1 Brand und +1 technische Rettung.',3200)+
 upgradeCard('rtw','🚑 Zusätzlicher RTW','Ein dritter RTW wird in Dienst gestellt.',5200);
}

function upgradeCard(id,title,desc,cost){
 const done=upgrades[id];
 return '<div class="upgrade"><h3>'+title+'</h3><div class="muted">'+desc+'</div><button data-upgrade="'+id+'" '+(done||money<cost?'disabled':'')+'>'+(done?'✓ Bereits gekauft':cost+' € investieren')+'</button></div>';
}

function bindUi(){
 document.querySelector('#tabIncident').onclick=()=>{rightMode='incident';render()};
 document.querySelector('#tabManage').onclick=()=>{rightMode='manage';render()};
 document.querySelectorAll('[data-inc]').forEach(e=>e.onclick=()=>{
   selected=e.dataset.inc;chosen=[];rightMode='incident';
   const i=I();if(i)map.panTo([i.lat,i.lng]);
   render();
 });
 document.querySelectorAll('[data-veh]').forEach(e=>e.onclick=()=>{
   const id=e.dataset.veh;chosen=chosen.includes(id)?chosen.filter(x=>x!==id):[...chosen,id];render();
 });
 document.querySelectorAll('[data-choice]').forEach(e=>e.onclick=()=>chooseDecision(+e.dataset.choice));
 document.querySelectorAll('[data-upgrade]').forEach(e=>e.onclick=()=>buyUpgrade(e.dataset.upgrade));
 const aao=document.querySelector('#aaoBtn');if(aao)aao.onclick=alarmAao;
 document.querySelectorAll('[data-speed]').forEach(e=>e.onclick=()=>{speed=+e.dataset.speed;paused=false;render()});
 document.querySelector('#pauseBtn').onclick=()=>{paused=!paused;render()};
 document.querySelector('#resetBtn').onclick=reset;
 const d=document.querySelector('#dispatchBtn');if(d)d.onclick=dispatch;
}

function chooseDecision(idx){
 const i=I();if(!i||i.decisionMade||!i.decision)return;
 const ch=i.decision.choices[idx];if(!ch)return;
 if(ch.cost&&ch.cost>money)return;
 if(ch.cost)money-=ch.cost;
 i.work+=ch.work||0;
 i.need+=ch.need||0;
 i.risk=clamp(i.risk+(ch.risk||0),0,100);
 if(ch.support)i.support={eta:ch.support.eta,caps:{...ch.support.caps},label:ch.label};
 i.decisionMade=true;
 i.log.push({text:ch.log,tone:ch.risk>0?'warn':'good'});
 render();
}

function buyUpgrade(id){
 if(upgrades[id])return;
 const cost={agt:2500,crew:1800,hlf:3200,rtw:5200}[id];
 if(money<cost)return;
 money-=cost;upgrades[id]=true;
 if(id==='agt'){const s=S('a');s.agt+=2;s.maxAgt+=2}
 if(id==='crew'){const s=S('b');s.crew+=4;s.maxCrew+=4}
 if(id==='hlf'){const v=vehicles.find(v=>v.id==='h');v.caps.fire++;v.caps.rescue++}
 if(id==='rtw'){
   const s=S('c');
   s.crew+=2;s.maxCrew+=2;
   vehicles.push({id:'r3',type:'RTW',call:'Rettung 1-83-3',station:'c',caps:{medical:3},personnel:{crew:2,agt:0},lat:s.lat,lng:s.lng,status:'free',target:null,route:null,routeIndex:0,routeDistance:0,routeDuration:0,reserved:false});
 }
 render();
}

function spawnIncident(){
 if(spawningIncident)return;
 if(incidents.filter(i=>i.status==='open').length>=4){nextIncidentAt=clock+180;return}
 nextIncidentAt=clock+360+Math.floor(Math.random()*240);
 createRandomIncident(true);
}

async function fetchRoute(from,to){
 const url='https://router.project-osrm.org/route/v1/driving/'+
   from.lng+','+from.lat+';'+to.lng+','+to.lat+
   '?overview=full&geometries=geojson&steps=false';
 const res=await fetch(url);
 if(!res.ok)throw new Error('Routing HTTP '+res.status);
 const data=await res.json();
 if(data.code!=='Ok'||!data.routes||!data.routes[0])throw new Error(data.code||'Keine Route');
 const r=data.routes[0];
 return{
   points:r.geometry.coordinates.map(([lng,lat])=>({lat,lng})),
   distance:r.distance,
   duration:r.duration
 };
}

async function planRoute(v,to,status,incident){
 v.status='routing';
 v.route=null;
 v.routeIndex=0;
 render();
 try{
   const r=await fetchRoute({lat:v.lat,lng:v.lng},to);
   v.route=r.points;
   v.routeIndex=1;
   v.routeDistance=r.distance;
   v.routeDuration=r.duration;
   v.status=status;
   if(incident&&status==='go'){
     incident.log.push({
       text:v.call+': Route berechnet · '+(r.distance/1000).toFixed(1)+' km · ca. '+Math.max(1,Math.round(r.duration/60))+' min.',
       tone:''
     });
   }
 }catch(err){
   v.route=[{lat:v.lat,lng:v.lng},{lat:to.lat,lng:to.lng}];
   v.routeIndex=1;
   v.routeDistance=0;
   v.routeDuration=0;
   v.status=status;
   if(incident){
     incident.log.push({text:v.call+': Routing nicht erreichbar, direkte Ersatzroute aktiv.',tone:'warn'});
   }
 }
 render();
}

function dispatchIds(ids,i,source='Manuell'){
 let sent=0;
 ids.forEach(id=>{
   const v=vehicles.find(x=>x.id===id);
   if(v&&v.status==='free'&&crewAvailable(v)&&reserveCrew(v)){
     v.target=i.id;
     planRoute(v,i,'go',i);
     sent++;
   }
 });
 i.log.push({text:source+': '+sent+' Fahrzeug(e) alarmiert. Straßenrouten werden berechnet.',tone:sent?'':'warn'});
 chosen=[];
 render();
}

function dispatch(){
 const i=I();if(!i)return;
 dispatchIds([...chosen],i,'Manuell');
}

function metersBetween(a,b){
 const lat=(a.lat+b.lat)*Math.PI/360;
 const dy=(b.lat-a.lat)*111320;
 const dx=(b.lng-a.lng)*111320*Math.cos(lat);
 return Math.hypot(dx,dy);
}

function moveAlongRoute(v,step){
 if(!v.route||v.routeIndex>=v.route.length)return true;
 const avgSpeed=(v.routeDistance>0&&v.routeDuration>0)
   ? v.routeDistance/v.routeDuration
   : 12;
 let remaining=avgSpeed*step*SIM_TIME_SCALE;
 while(remaining>0&&v.routeIndex<v.route.length){
   const target=v.route[v.routeIndex];
   const d=metersBetween(v,target);
   if(d<2){
     v.lat=target.lat;
     v.lng=target.lng;
     v.routeIndex++;
     continue;
   }
   if(d<=remaining){
     v.lat=target.lat;
     v.lng=target.lng;
     v.routeIndex++;
     remaining-=d;
   }else{
     const ratio=remaining/d;
     v.lat+=(target.lat-v.lat)*ratio;
     v.lng+=(target.lng-v.lng)*ratio;
     remaining=0;
   }
 }
 if(v.routeIndex>=v.route.length){
   const last=v.route[v.route.length-1];
   v.lat=last.lat;
   v.lng=last.lng;
   v.route=null;
   v.routeIndex=0;
   return true;
 }
 return false;
}

function finishIncident(i,success){
 if(i.status!=='open')return;
 i.status=success?'done':'failed';
 if(success){
   i.log.push({text:'Einsatz beendet. Maßnahmen erfolgreich abgeschlossen.',tone:'good'});
   money+=i.reward;xp+=i.xp;completed++;rep=Math.min(100,rep+2);
 }else{
   i.log.push({text:'Einsatz außer Kontrolle. Hoher Schaden und Reputationsverlust.',tone:'danger'});
   money=Math.max(0,money-500);failed++;rep=Math.max(0,rep-8);
 }
 vehicles.filter(v=>v.target===i.id&&(v.status==='scene'||v.status==='go'||v.status==='routing')).forEach(v=>{
   const s=S(v.station);
   if(v.status==='scene')planRoute(v,s,'back',null);
   else{
     v.route=null;v.routeIndex=0;planRoute(v,s,'back',null);
   }
 });
}

function tick(dt){
 if(paused)return;
 const step=dt*speed;
 const simStep=step*SIM_TIME_SCALE;
 clock+=simStep;

 if(clock>=nextIncidentAt)spawnIncident();

 vehicles.forEach(v=>{
   if(v.status==='go'){
     const i=incidents.find(x=>x.id===v.target);
     if(!i||i.status!=='open')return;
     if(moveAlongRoute(v,step)){
       v.status='scene';
       i.log.push({text:v.call+' an der Einsatzstelle eingetroffen.',tone:''});
     }
   }else if(v.status==='back'){
     if(moveAlongRoute(v,step)){
       v.status='free';
       v.target=null;
       releaseCrew(v);
     }
   }
 });

 incidents.forEach(i=>{
   if(i.status!=='open')return;
   i.age+=simStep;

   if(i.support&&!i.supportArrived){
     i.support.eta-=simStep;
     if(i.support.eta<=0){
       i.supportArrived=true;
       i.log.push({text:'Nachgeforderte Unterstützung ist eingetroffen.',tone:'good'});
     }
   }

   const on=vehicles.filter(v=>v.target===i.id&&v.status==='scene');
   const caps=availableCaps(i);

   if(on.length&&i.stage===0){
     i.stage=1;
     i.log.push({text:'Ersteintreffend: Lage bestätigt. Jetzt ist eine taktische Entscheidung nötig.',tone:'warn'});
   }

   if(on.length){
     const requirements=Object.entries(i.req);
     const coverage=requirements.reduce((sum,[k,n])=>sum+Math.min(1,(caps[k]||0)/n),0)/requirements.length;
     const missing=1-coverage;
     i.work+=simStep*(0.10+0.42*coverage);
     if(i.decisionMade){
       i.risk=clamp(i.risk+simStep*(missing*0.045-coverage*0.018),0,100);
     }else{
       i.risk=clamp(i.risk+simStep*(0.018+missing*0.035),0,100);
     }
   }else{
     i.risk=clamp(i.risk+simStep*0.012,0,100);
   }

   if(i.risk>=100)finishIncident(i,false);
   else if(i.work>=i.need&&i.decisionMade)finishIncident(i,true);
 });
}

initLayout();
reset();

let last=performance.now(),acc=0;
function loop(now){
 acc+=(now-last)/1000;last=now;
 if(acc>.35){tick(.35);acc=0;render()}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
